[package]
name = "mdfu-tui"
description = "Interactive ratatui interface for mdfu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mdfu-core = { path = "../mdfu-core" }
regex = "1"
# ratatui 0.30.2 is the newest line; tui-input 0.15.5 requires ^0.30.2 and
# tui-markdown 0.3.10 requires ^0.30, so the three resolve together.
ratatui = "0.30.2"
tui-input = "0.15.5"
# No default features: `highlight-code` would bake syntect's Base16OceanDark
# colors into code blocks, and widgets must take every color from the theme.
tui-markdown = { version = "0.3.10", default-features = false }
