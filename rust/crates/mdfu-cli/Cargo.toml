[package]
name = "mdfu-cli"
description = "The mdfu command-line binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The binary keeps the `mdfu` name even though the package is `mdfu-cli`.
[[bin]]
name = "mdfu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
mdfu-core = { path = "../mdfu-core" }
# Wired into interactive mode by todo 30 (note picker + injected filter).
mdfu-tui = { path = "../mdfu-tui" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
