[package]
name = "mdfu-core"
description = "Content and search logic for mdfu: scan, parse, query, rank, output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
etcetera = "0.11"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
