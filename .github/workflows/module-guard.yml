name: Module Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Rust is the implementation and the release source since the todo-36 cutover;
  # guard the workspace shape so a second Cargo workspace or a stray crate
  # cannot land unnoticed.
  single-workspace:
    name: Single Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert one Cargo workspace (rust/) with exactly 3 locked member crates
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ ! -f rust/Cargo.toml ]; then
            fail "rust/Cargo.toml missing — the single Cargo workspace root must exist"
          fi

          manifests=$(find . -path ./.git -prune -o -path ./website -prune -o -name 'Cargo.toml' -print | sed 's|^\./||' | sort)
          expected="rust/Cargo.toml
          rust/crates/mdfu-cli/Cargo.toml
          rust/crates/mdfu-core/Cargo.toml
          rust/crates/mdfu-tui/Cargo.toml"
          echo "Cargo.toml files outside website/:"
          echo "$manifests"
          if [ "$manifests" != "$expected" ]; then
            fail "expected only rust/Cargo.toml plus crates/{mdfu-core,mdfu-tui,mdfu-cli}/Cargo.toml"
          fi

          locks=$(find . -path ./.git -prune -o -path ./website -prune -o -name 'Cargo.lock' -print | sed 's|^\./||' | sort)
          if [ "$locks" != "rust/Cargo.lock" ]; then
            fail "expected exactly one Cargo.lock at rust/Cargo.lock, found: ${locks:-none}"
          fi

          roots=""
          for manifest in $manifests; do
            if grep -q '^\[workspace\]' "$manifest"; then
              roots="$roots $manifest"
            fi
          done
          if [ "$roots" != " rust/Cargo.toml" ]; then
            fail "[workspace] must be declared only in rust/Cargo.toml (found:${roots:-none})"
          fi

          member_count=$(sed -n '/^members *=/,/^\]/p' rust/Cargo.toml | grep -c '"crates/.*"' || true)
          if [ "$member_count" -ne 3 ]; then
            fail "rust/Cargo.toml [workspace] members must list exactly 3 crates, found $member_count"
          fi
          for crate in mdfu-core mdfu-tui mdfu-cli; do
            grep -q "\"crates/$crate\"" rust/Cargo.toml ||
              fail "rust/Cargo.toml [workspace] members must list crates/$crate"
          done

          echo "Single-workspace layout OK (rust/Cargo.toml + 3 member crates)"
