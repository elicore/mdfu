name: Release Check

# Rust snapshot packaging check. Todo 36 promoted the Rust build to the
# release source, so this replaces the former Go snapshot; never publishes.
# Verifies the six `mdfu` archives, checksums.txt and the generated Homebrew
# cask are mutually consistent. rustup + zig + cargo-zigbuild are required by
# GoReleaser's Rust builder and installed below.

on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/brew.yml"
      - "Casks/**"
      - "LICENSE"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "PARITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Rust snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"
      - name: snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      # A snapshot is only useful if it is internally consistent: all six
      # archives carry the snapshot version, its checksums verify, and the
      # generated cask pins the same version.
      - name: verify snapshot artifacts
        run: |
          set -euo pipefail
          cask="$(find dist -path '*Casks/mdfu.rb' -print -quit)"
          test -n "$cask"
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")"
          test -n "$version"
          archives="$(find dist -maxdepth 1 -type f \
            \( -name 'mdfu_*.tar.gz' -o -name 'mdfu_*.zip' \) | sort)"
          test "$(printf '%s\n' "$archives" | wc -l)" -eq 6
          test "$(printf '%s\n' "$archives" | grep -c "mdfu_${version}_")" -eq 6
          test "$(grep -c 'mdfu_#{version}_' "$cask")" -eq 4
          (cd dist && sha256sum --check checksums.txt)
          echo "snapshot $version: 6 archives, checksums.txt, cask OK"
