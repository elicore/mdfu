version: 2

project_name: mdfu

before:
  hooks:
    - go mod tidy

builds:
  - id: mdfu
    main: ./cmd/mdfu
    binary: mdfu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mdfu
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - PLAN.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: mdfu
    ids:
      - mdfu
    binaries:
      - mdfu
    directory: Casks
    homepage: https://github.com/elicore/mdfu
    description: Fuzzy finder for Markdown notes
    skip_upload: auto
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }} [skip ci]"
    repository:
      owner: elicore
      name: mdfu
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
