[package]
name = "mdfu-cli"
description = "The mdfu command-line binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The binary keeps the `mdfu` name even though the package is `mdfu-cli`.
[[bin]]
name = "mdfu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
mdfu-core = { path = "../mdfu-core" }
mdfu-tui = { path = "../mdfu-tui" }
# Terminal setup + event loop driver for the interactive picker. Must match the
# version mdfu-tui uses so `Terminal<CrosstermBackend<Stdout>>` is one type.
ratatui = "0.30.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
